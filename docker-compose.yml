# слева это снаружи контейнера, справа внутри контейнера
# http://localhost:9000

# version: '3.8'

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - 9000:8080
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    networks:
      - tg-bot-net


  zookeeper:
    image: zookeeper
    ports:
      - 2181:2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - tg-bot-net

  kafka-1:
    image: wurstmeister/kafka
    ports:
      - 9095:9094
    environment:
      KAFKA_BROKER_ID: 500
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://kafka-1:9092,OUTSIDE://kafka-1:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,OUTSIDE://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LOG_DIRS: /kafka/logs
      KAFKA_offsets_topic_replication_factor: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tg-bot-net


  kafka-2:
    image: wurstmeister/kafka
    ports:
      - 9096:9094
    environment:
      KAFKA_BROKER_ID: 501
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://kafka-2:9092,OUTSIDE://kafka-2:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,OUTSIDE://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LOG_DIRS: /kafka/logs
      KAFKA_offsets_topic_replication_factor: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - tg-bot-net


  kafka-3:
    image: wurstmeister/kafka
    ports:
      - 9097:9094
    environment:
      KAFKA_BROKER_ID: 502
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://kafka-3:9092,OUTSIDE://kafka-3:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,OUTSIDE://localhost:9097
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LOG_DIRS: /kafka/logs
      KAFKA_offsets_topic_replication_factor: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
    - tg-bot-net


  tg-bot:
    image: my-tg-bot
    ports:
      - 5001:5001
    environment:
      TG_BOT_TOKEN: 7964767527:AAHWj-x5ItudN-IyFEFwPaErz8yCa9y4Elw
      SERVER_PORT: :5001
      KAFKA_PORT_01: kafka-1:9092
      KAFKA_PORT_02: kafka-2:9092
      KAFKA_PORT_03: kafka-3:9092
      NAME_TOPIC_01: tgbot-tgapp
      NAME_TOPIC_02: texttospeech-tgbot
      NAME_TOPIC_03: tgapp-texttospeech
      NAME_TOPIC_04: tgapp-tgbot

      DB_HOST: postgres-db
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB_NAME: postgres
      DB_SSL_MODE: disable
    networks:
      - tg-bot-net

  tg-app:
    image: my-tg-app
    ports:
      - 5002:5002
    environment:
      TELEGRAM_API_ID: 27872122
      TELEGRAM_API_HASH: 6599085d191668bc4190c2cefdbb48f0
      PHONE: +375298370019
      TELEGRAM_PASSWORD: 7#_QA6g-1Hd5+zF=2?TE-jqk4pA
      SERVER_PORT: 5002
      KAFKA_PORT_01: kafka-1:9092
      KAFKA_PORT_02: kafka-2:9092
      KAFKA_PORT_03: kafka-3:9092
      KAFKA_TOPIC_01: tgbot-tgapp
      KAFKA_TOPIC_02: tgapp-texttospeech
      KAFKA_TOPIC_03: tgapp-tgbot
    networks:
      - tg-bot-net

  text-to-speech:
    image: my-text-to-speech
    ports:
      - 5003:5003
    environment:
      SERVER_PORT: 5003
      GOOGLE_CREDENTIALS_FILE: /app/semiotic-mender-459813-c9-fdcf02adec5e.json
      KAFKA_PORT_01: kafka-1:9092
      KAFKA_PORT_02: kafka-2:9092
      KAFKA_PORT_03: kafka-3:9092
      NAME_TOPIC_01: tgapp-texttospeech
      NAME_TOPIC_02: texttospeech-tgbot
      KAFKA_GROUP_ID: text-to-speech-group
    networks:
      - tg-bot-net

  postgres-db:
    image: postgres:15.2
    # container_name: tg-bot-db-postgres
    ports:
      - 5439:5432
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - tg-bot-net
      # restart: unless-stopped
      # healthcheck:
      # test: [ "CMD-SHELL", "pg_isready -U bot_user -d telegram_bot" ] # Команда проверки
      # interval: 10s # Интервал между проверками
      # timeout: 5s # Максимальное время ожидания ответа
      # retries: 5 # Количество попыток перед объявлением "нездоровым"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - 9898:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./metrics/prometheus:/prometheus:rw
    networks:
      - tg-bot-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - 3888:3000
    volumes:
     - ./metrics/grafana:/var/lib/grafana:rw
    networks:
      - tg-bot-net


networks:
  tg-bot-net:
    driver: bridge
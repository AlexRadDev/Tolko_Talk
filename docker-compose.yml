# Этот файл описывает конфигурацию сервисов для запуска docker контэйнеров Zookeeper, Kafka и UI for Apache Kafka.
# http://localhost:9000

version: '3'

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "9000:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    networks:
      - kafka-net


  zookeeper:
    image: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - kafka-net

  kafka-1:
    image: wurstmeister/kafka
    ports:
      - "9095:9094"
    environment:
      KAFKA_BROKER_ID: 500
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://kafka-1:9092,OUTSIDE://kafka-1:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,OUTSIDE://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LOG_DIRS: /kafka/logs
      KAFKA_offsets_topic_replication_factor: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - kafka-net


  kafka-2:
    image: wurstmeister/kafka #confluentinc/cp-server:7.7.1
    ports:
      - "9096:9094"
    environment:
      KAFKA_BROKER_ID: 501
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://kafka-2:9092,OUTSIDE://kafka-2:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,OUTSIDE://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LOG_DIRS: /kafka/logs
      KAFKA_offsets_topic_replication_factor: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - kafka-net


  kafka-3:
    image: wurstmeister/kafka #confluentinc/cp-server:7.7.1
    ports:
      - "9097:9094"
    environment:
      KAFKA_BROKER_ID: 502
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://kafka-3:9092,OUTSIDE://kafka-3:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,OUTSIDE://localhost:9097
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LOG_DIRS: /kafka/logs
      KAFKA_offsets_topic_replication_factor: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
    - kafka-net


  tg-bot:
    image: my-tg-bot
    ports:
      - "5001:5001"
    environment:
      TG_BOT_TOKEN: 7964767527:AAHWj-x5ItudN-IyFEFwPaErz8yCa9y4Elw
      SERVER_PORT: :5001
      KAFKA_PORT_01: kafka-1:9092
      KAFKA_PORT_02: kafka-2:9092
      KAFKA_PORT_03: kafka-3:9092
      NAME_TOPIC_01: tgbot-tgapp
      NAME_TOPIC_02: texttospeech-tgbot
      NAME_TOPIC_03: tgapp-texttospeech
    networks:
      - kafka-net

  tg-app:
    image: my-tg-app
    ports:
      - "5002:5002"
    environment:
      TELEGRAM_API_ID: 27872122
      TELEGRAM_API_HASH: 6599085d191668bc4190c2cefdbb48f0
      PHONE: +375298370019
      TELEGRAM_PASSWORD: 7#_QA6g-1Hd5+zF=2?TE-jqk4pA
      PORT: 5002
      KAFKA_PORT_01: kafka-1:9092
      KAFKA_PORT_02: kafka-2:9092
      KAFKA_PORT_03: kafka-3:9092
      KAFKA_TOPIC_01: tgbot-tgapp
      KAFKA_TOPIC_02: tgapp-texttospeech
    networks:
      - kafka-net

  text-to-speech:
    image: my-text-to-speech
    ports:
      - "5003:5003"
    environment:
      SERVER_PORT: :5003
      GOOGLE_CREDENTIALS_FILE: /app/semiotic-mender-459813-c9-fdcf02adec5e.json
      KAFKA_PORT_01: kafka-1:9092
      KAFKA_PORT_02: kafka-2:9092
      KAFKA_PORT_03: kafka-3:9092
      NAME_TOPIC_01: tgapp-texttospeech
      NAME_TOPIC_02: texttospeech-tgbot
      KAFKA_GROUP_ID: text-to-speech-group
    networks:
      - kafka-net


networks:
  kafka-net:
    driver: bridge
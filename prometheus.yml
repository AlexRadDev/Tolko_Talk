global:
  scrape_interval: 5s      # Интервал опроса метрик (каждые 5 секунд)
  evaluation_interval: 5s  # Интервал оценки правил (каждые 5 секунд)

# Конфигурация задач для сбора метрик
scrape_configs:
  - job_name: 'tg-bot'
    static_configs:
      - targets: ['tg-bot:5001']

  - job_name: 'tg-app'
    static_configs:
      - targets: [ 'tg-app:5002' ]

  - job_name: 'text-to-speech'
    static_configs:
      - targets: [ 'text-to-speech:5003' ]